name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The core claims zero dependencies and support from 3.11. Both are only
    # true if they are checked on every version claimed, on more than one OS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Tests run with no dependencies installed
        run: python -m unittest discover -s tests -t .

      - name: Everything compiles
        run: python -m compileall -q src/memory_fabric experiments tests examples

  package:
    # A wheel that builds but omits the dashboard, or whose console script does
    # not exist, fails only in front of a user. Check it here instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install --upgrade build
      - run: python -m build --wheel --outdir dist

      - name: Wheel ships the dashboard and excludes experiments
        run: |
          python - <<'EOF'
          import glob, zipfile, sys
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          checks = {
              "dashboard bundled": any("dashboard.html" in n for n in names),
              "experiments excluded": not any(n.startswith("experiments/") for n in names),
              "tests excluded": not any(n.startswith("tests/") for n in names),
              # PEP 561. Without it the type hints ship and no consuming type
              # checker reads them.
              "py.typed marker": "memory-fabric/py.typed" in names,
              "licence recorded": any("LICENSE" in n for n in names),
          }
          for name, ok in checks.items():
              print(("PASS " if ok else "FAIL ") + name)
          sys.exit(0 if all(checks.values()) else 1)
          EOF

      - name: Installs clean and the console script works
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/v/bin/memory-fabric --db /tmp/ci.db demo
          # --json is a global flag and goes before the subcommand. CI caught
          # this the first time it ran, which is the job working as intended.
          /tmp/v/bin/memory-fabric --db /tmp/ci.db --json overview > /tmp/out.json
          python -c "import json;d=json.load(open('/tmp/out.json'));assert d['total_memories']>0;assert d['schema_version'];print('overview ok', d['schema_version'])"

      - name: Doctor reports the installed store sound
        run: |
          # The one check that only an installed copy can make: `doctor`
          # verifies the dashboard asset is present, which is a packaging
          # failure that otherwise surfaces when an operator opens the page.
          /tmp/v/bin/memory-fabric --db /tmp/ci.db --json doctor > /tmp/doc.json
          python - <<'EOF'
          import json, sys
          report = json.load(open("/tmp/doc.json"))
          bad = [f for f in report["findings"] if f["status"] != "ok"]
          for finding in report["findings"]:
              print(f"{finding['status']:<4} {finding['name']}: {finding['detail']}")
          sys.exit(1 if bad or not report["sound"] else 0)
          EOF

      - name: Installed-wheel public types are consumed and checked
        run: |
          python -m pip install "mypy==2.1.0"
          python tools/check_typed_consumer.py dist/memory-fabric-*.whl

  docker:
    # The image is a wheel on a slim base and nothing else, so the thing worth
    # checking is that it builds and that the server inside it answers over the
    # published port as a non-root user. Done here because the development
    # machine has no Docker daemon.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t memory-fabric:ci .

      - name: Container serves the dashboard over the published port
        env:
          # Supplied rather than scraped from the startup banner, which is also
          # how an operator should run it: the token never enters the process list.
          MEMORY_FABRIC_TOKEN: ci-token-for-the-container-check
        run: |
          docker run -d --name mf -p 8765:8765 -e MEMORY_FABRIC_TOKEN memory-fabric:ci
          for i in $(seq 1 30); do
            curl -fsS -H "Authorization: Bearer $MEMORY_FABRIC_TOKEN" http://localhost:8765/api/overview -o /tmp/ov.json && break
            sleep 1
          done
          python -c "import json; d=json.load(open('/tmp/ov.json')); print('schema', d['schema_version'])"
          test "$(docker exec mf id -u)" = "10001"

      - name: Content keys live on the key volume, not in the database
        env:
          MEMORY_FABRIC_TOKEN: ci-token-for-the-container-check
        run: |
          # Seeded by a second process while the server runs: the dashboard
          # must see the writes (cross-process freshness) and the keys must
          # land in /keys, leaving none in the database file.
          docker exec mf memory-fabric --db /data/store.db demo
          test -n "$(docker exec mf ls /keys)"
          in_db=$(docker exec mf python -c "import sqlite3; print(sqlite3.connect('/data/store.db').execute('SELECT COUNT(*) FROM content_keys WHERE key_material IS NOT NULL').fetchone()[0])")
          test "$in_db" = "0" || { echo "expected no keys in the database, found $in_db"; exit 1; }
          curl -fsS -H "Authorization: Bearer $MEMORY_FABRIC_TOKEN" http://localhost:8765/api/overview -o /tmp/ov2.json
          python -c "import json; d=json.load(open('/tmp/ov2.json')); assert d['total_memories'] > 0, d; print('dashboard sees', d['total_memories'], 'memories')"

      - name: Unauthenticated requests are refused
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8765/api/overview)
          test "$code" = "401" || { echo "expected 401, got $code"; exit 1; }
          docker rm -f mf

  postgres:
    # The optional backend, against a real server. Two layers: the
    # Postgres-specific properties (concurrent writers on separate processes,
    # append-only enforced by the database, no password in any output), and
    # the *whole* suite with every in-memory store backed by Postgres instead,
    # so the backend is held to the same assertions as SQLite.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MF_TEST_POSTGRES_URL: postgresql://postgres:ci-only-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "psycopg>=3.1"
      - name: Postgres-specific properties
        run: python -m unittest tests.test_postgres -v
      - name: Every storage-touching test module on Postgres
        run: |
          # Excluded: the research benchmarks and simulated worlds. They build
          # thousands of throwaway stores to measure retrieval and dynamics,
          # say nothing about storage, and take hours as Postgres schemas.
          # Everything else -- the event log, chain, enforcement, retraction,
          # federation, erasure, identity, SDK, MCP, agent API -- runs here.
          python - <<'EOF'
          import pathlib, subprocess, sys
          excluded = {
              "test_banditworld", "test_depotworld", "test_experiment_harnesses",
              "test_external_bench", "test_facet_v1", "test_h3_harness",
              "test_p2_sufficiency", "test_poisonworld", "test_propagation_v1", "test_relevance_bench",
              "test_relevance_v2", "test_retention_arms", "test_ruleworld",
          }
          modules = sorted(f"tests.{p.stem}" for p in pathlib.Path("tests").glob("test_*.py")
                           if p.stem not in excluded)
          print(len(modules), "modules")
          sys.exit(subprocess.call([sys.executable, "-m", "unittest", *modules]))
          EOF

  faults:
    # The deterministic integrity fault matrix. Not a benchmark: it replays
    # exact fault schedules and asserts six invariants after every step, so a
    # failure is a reproducible counterexample rather than an effect size. It
    # found a real bug on its first run — a recipient's locally derived
    # conclusions were being quarantined instead of contested.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m experiments.faultsim

  mutation:
    # Curated mutants of the security guards (tenant, visibility, signature,
    # grant, replay, hop limit, payload limit). Each must be killed by its
    # named tests; a survivor is an untested guard and fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: python tools/mutation_check.py

  fresh-machine:
    # Install the wheel into a new venv outside the repo, run the quickstart
    # and the reference agent against the installed package, init + doctor,
    # then uninstall and check nothing is left (tools/fresh_machine.py).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build --wheel --outdir dist
      - shell: bash
        run: python tools/fresh_machine.py dist/*.whl

  release-evidence:
    # The evidence bundle for this exact commit: SHA, SBOM, secret scan,
    # adversarial gate, test counts, wheel hash (tools/release_bundle.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build
      - run: python -m build --wheel --outdir dist
      - run: python tools/release_bundle.py --out release-evidence --wheel dist/*.whl --bench full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: release-evidence

  multihost:
    # Separate store server processes, real HTTP between them through a
    # latency proxy (50 ms a hop): share A -> B -> C by signed offers, correct
    # at A, and the correction must reach C; then again with C down during
    # the correction, converging after it restarts (experiments/multihost.py).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m experiments.multihost --latency-ms 50 --out multihost.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multihost-${{ matrix.os }}
          path: multihost.json

  multihost-compose:
    # The same scenario with each store in its own container and network
    # stack, federating over the Docker network by service name. One
    # physical machine, several network hosts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The image seals content with AES-GCM (production profile), so the
      # driver on the host needs the same library to read those stores.
      - run: python -m pip install "cryptography>=42"
      - run: python -m experiments.multihost --mode prepare
      - run: HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose -f deploy/multihost/docker-compose.yml up -d --build
      - run: python -m experiments.multihost --mode compose --out multihost-compose.json
      - if: failure()
        run: docker compose -f deploy/multihost/docker-compose.yml logs
      - if: always()
        run: docker compose -f deploy/multihost/docker-compose.yml down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multihost-compose
          path: multihost-compose.json

  adversarial-gate:
    # Every attack family's invariants, by name (tools/adversarial_gate.py).
    # A family that fails, errors or loses all its tests fails the gate, and
    # a release needs it green on the exact commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/adversarial_gate.py --report adversarial-gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adversarial-gate
          path: adversarial-gate.json

  e2e:
    # Real process boundaries the unit suite cannot cross: an agent-api server
    # in its own process, a CLI process that retracts, an action gate in a
    # third, a child killed with os._exit mid-retraction, and backup/restore.
    # It found the gate verifying against a stale projection on its first run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: python -m experiments.e2e_validation --quick

  rollback:
    # Upgrade-and-rollback with real older code: back up on the last release,
    # upgrade and write with this commit, check the old code refuses the
    # upgraded store, restore the backup, and check both versions call it
    # sound (experiments/rollback_drill.py; docs/OPERATIONS.md §4-5).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m experiments.rollback_drill --old-ref v0.11.0

  claude-contract:
    # The Claude adapter through the real anthropic SDK, HTTP stubbed: the SDK
    # must accept every argument the adapter sends and the adapter must read
    # the SDK's own response types. Not a live call; no credentials needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install anthropic
      - run: python -m unittest tests.test_claude_contract -v

  lint:
    # ruff and mypy as configured in pyproject.toml. Enforced, not
    # informational: both were clean when this job was added.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff==0.15.13" "mypy==2.1.0"
      - run: python -m ruff check
      - run: python -m mypy

  langchain-contract:
    # The LangChain retriever against the real library; the main jobs install
    # nothing, so there it is skipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "langchain-core>=0.3"
      - run: python -m unittest tests.test_integrations -v

  mcp-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "mcp==1.26.0"
      - run: python -m unittest tests.test_mcp_official -v

  framework-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "openai-agents==0.24.0" "langgraph==1.2.11"
      - run: python -m unittest tests.test_framework_contracts -v

  document-formats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ".[documents]"
      - run: python -m unittest tests.test_document_formats tests.test_ingest_hardening -v

  secrets:
    # The project ships a sensitive-data detector. Pointing it at the repo is
    # both a smoke test of the detector and a guard on what gets committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/scan_secrets.py

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render the chart
        run: |
          helm lint deploy/helm/memory-fabric --set dashboard.token=ci-token
          helm template t deploy/helm/memory-fabric --set dashboard.token=ci-token > /tmp/out.yaml
          helm template t deploy/helm/memory-fabric --set dashboard.token=ci-token \
            --set agentApi.enabled=true --set agentApi.agentsSecret=agents \
            --set mode=regulated --set embedder=ollama:nomic-embed-text >> /tmp/out.yaml
          python3 -c "import yaml,sys; docs=[d for d in yaml.safe_load_all(open('/tmp/out.yaml')) if d]; kinds=sorted({d['kind'] for d in docs}); print(kinds); assert {'Deployment','Service','PersistentVolumeClaim','Secret'} <= set(kinds)"

name: dataset-probe

# Reads the licence and layout of datasets the benchmark registry lists before
# any adapter ingests them (masterplan §7A.2 licence gate). Prints licence
# lines, file names and sizes, and field names of a first record; no content.

on:
  push:
    paths: [".github/workflows/dataset-probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: GitHub licences and READMEs
        run: |
          set +e
          for repo in snap-research/locomo harveyai/harvey-labs sierra-research/tau2-bench texttron/BrowseComp-Plus \
                      yale-nlp/Bright-Pro patronus-ai/financebench HUST-AI-HYZ/MemoryAgentBench ByteDance-Seed/WideSearch \
                      SWE-bench/SWE-bench; do
            echo "=== $repo"
            curl -fsSL "https://api.github.com/repos/$repo" | python3 -c "import json,sys; d=json.load(sys.stdin); print('licence:', (d.get('license') or {}).get('spdx_id'), '| size KB:', d.get('size'))"
            curl -fsSL "https://raw.githubusercontent.com/$repo/HEAD/README.md" | grep -inE "licen[cs]e|cc[- ]by|non-commercial|terms of use" | head -8
          done
      - name: Hugging Face dataset cards
        run: |
          set +e
          for ds in Tevatron/browsecomp-plus-corpus Tevatron/browsecomp-plus yale-nlp/BRIGHT-Pro xlangai/BRIGHT PatronusAI/financebench \
                    ai-hyz/MemoryAgentBench ByteDance-Seed/WideSearch princeton-nlp/SWE-bench_Verified ArtificialAnalysis/AA-LCR \
                    Salesforce/LoCoMo snap-research/locomo; do
            echo "=== $ds"
            curl -fsSL "https://huggingface.co/api/datasets/$ds" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print('gated:', d.get('gated'), '| licence tags:', [t for t in d.get('tags',[]) if t.startswith('license')])
          print('files:', [s['rfilename'] for s in d.get('siblings',[])][:25])"
          done
      - name: tau2-bench knowledge domain layout
        run: |
          set +e
          curl -fsSL "https://api.github.com/repos/sierra-research/tau2-bench/git/trees/main?recursive=1" | python3 -c "
          import json,sys
          t=json.load(sys.stdin).get('tree',[])
          paths=[x['path'] for x in t]
          print(len(paths),'paths')
          print([p for p in paths if 'knowledge' in p.lower() or 'banking' in p.lower()][:40])"
      - name: harvey-labs firm-knowledge layout
        run: |
          set +e
          curl -fsSL "https://api.github.com/repos/harveyai/harvey-labs/git/trees/main?recursive=1" | python3 -c "
          import json,sys
          t=json.load(sys.stdin).get('tree',[])
          fk=[x for x in t if 'firm-knowledge' in x['path']]
          print(len(fk),'firm-knowledge paths; total bytes', sum(x.get('size',0) for x in fk))
          print([x['path'] for x in fk][:30])"

name: dataset-probe

# Reads the licence and layout of datasets the benchmark registry lists before
# any adapter ingests them (masterplan §7A.2 licence gate). Prints licence
# text heads, file names and sizes, and field names; no dataset content.

on:
  push:
    paths: [".github/workflows/dataset-probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Licences
        continue-on-error: true
        run: |
          for repo in snap-research/locomo harveyai/harvey-labs sierra-research/tau2-bench; do
            echo "=== $repo"
            curl -fsSL "https://api.github.com/repos/$repo" | python3 -c "import json,sys; d=json.load(sys.stdin); print('licence:', (d.get('license') or {}).get('spdx_id'))" || true
            for f in LICENSE LICENSE.md LICENSE.txt; do
              curl -fsSL "https://raw.githubusercontent.com/$repo/HEAD/$f" 2>/dev/null | head -4 && break
            done
            curl -fsSL "https://raw.githubusercontent.com/$repo/HEAD/README.md" | grep -inE "licen[cs]e|cc[- ]by|non-?commercial|terms" | head -6 || true
          done
          echo "=== WideSearch LICENSE"
          curl -fsSL "https://huggingface.co/datasets/ByteDance-Seed/WideSearch/resolve/main/LICENSE" | head -12 || true
      - name: Layouts
        continue-on-error: true
        run: |
          pip install -q pyarrow
          python3 - <<'PY'
          import io, json, urllib.request
          def get(u):
              return urllib.request.urlopen(u, timeout=60).read()
          import pyarrow.parquet as pq
          for name, url in [
              ("BRIGHT-Pro examples/biology", "https://huggingface.co/datasets/yale-nlp/BRIGHT-Pro/resolve/main/examples/biology.parquet"),
              ("BRIGHT-Pro documents/biology", "https://huggingface.co/datasets/yale-nlp/BRIGHT-Pro/resolve/main/documents/biology.parquet"),
              ("BRIGHT-Pro aspects/biology", "https://huggingface.co/datasets/yale-nlp/BRIGHT-Pro/resolve/main/aspects/biology.parquet"),
              ("MemoryAgentBench Conflict_Resolution", "https://huggingface.co/datasets/ai-hyz/MemoryAgentBench/resolve/main/data/Conflict_Resolution-00000-of-00001.parquet"),
              ("MemoryAgentBench Accurate_Retrieval", "https://huggingface.co/datasets/ai-hyz/MemoryAgentBench/resolve/main/data/Accurate_Retrieval-00000-of-00001.parquet"),
              ("BrowseComp-Plus queries", "https://huggingface.co/datasets/Tevatron/browsecomp-plus/resolve/main/data/test-00000-of-00006.parquet"),
          ]:
              try:
                  t = pq.read_table(io.BytesIO(get(url)))
                  row = t.slice(0, 1).to_pylist()[0]
                  print(f"=== {name}: rows {t.num_rows}, columns {t.column_names}")
                  print("   first-row value types/lengths:", {k: (type(v).__name__, len(v) if hasattr(v, '__len__') else v if isinstance(v, (int, float)) else '') for k, v in row.items()})
              except Exception as e:
                  print(f"=== {name}: error {e}")
          try:
              import csv
              rows = list(csv.DictReader(io.StringIO(get("https://huggingface.co/datasets/ArtificialAnalysis/AA-LCR/resolve/main/AA-LCR_Dataset.csv").decode("utf-8"))))
              print("=== AA-LCR:", len(rows), "rows; columns", list(rows[0]))
          except Exception as e:
              print("AA-LCR error", e)
          try:
              lines = get("https://huggingface.co/datasets/ByteDance-Seed/WideSearch/resolve/main/widesearch.jsonl").decode().splitlines()
              print("=== WideSearch:", len(lines), "tasks; keys", sorted(json.loads(lines[0])))
          except Exception as e:
              print("WideSearch error", e)
          PY
      - name: tau2 and harvey layouts
        continue-on-error: true
        run: |
          curl -fsSL "https://api.github.com/repos/sierra-research/tau2-bench/git/trees/main?recursive=1" | python3 -c "
          import json,sys
          t=json.load(sys.stdin).get('tree',[])
          print('tau2', len(t),'paths;', [x['path'] for x in t if 'knowledge' in x['path'].lower() or 'banking' in x['path'].lower()][:30])"
          curl -fsSL "https://api.github.com/repos/harveyai/harvey-labs/git/trees/main?recursive=1" | python3 -c "
          import json,sys
          t=json.load(sys.stdin).get('tree',[])
          fk=[x for x in t if 'firm-knowledge' in x['path']]
          print('harvey firm-knowledge', len(fk),'paths; bytes', sum(x.get('size',0) for x in fk)); print([x['path'] for x in fk][:25])"

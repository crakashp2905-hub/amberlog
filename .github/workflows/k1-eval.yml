# K1: topic navigation against search on LongMemEval (research/prereg/k1-topic-navigation.md).
name: k1-eval

on:
  workflow_dispatch:
  push:
    paths:
      - experiments/k1_navigation.py
      - src/memory_fabric/navigation.py
      - .github/workflows/k1-eval.yml

permissions:
  contents: read

jobs:
  k1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: |
          mkdir -p research/bench/longmemeval/data
          curl -fsSL -o research/bench/longmemeval/data/longmemeval_s_cleaned.json \
            https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json
      - run: python -m experiments.k1_navigation --limit 60

name: Publish approved Amberlog distributions

on:
  workflow_dispatch:
    inputs:
      index:
        description: Protected package index environment
        required: true
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read
  actions: read

concurrency:
  group: amberlog-publish-${{ inputs.index }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    if: >-
      github.ref_type == 'tag' && startsWith(github.ref_name, 'v') &&
      vars.AMBERLOG_APPROVED_SHA == github.sha &&
      vars.AMBERLOG_NAME_CLEARED == 'true' &&
      vars.AMBERLOG_RELEASE_GATES_PASSED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exact commit has successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --limit 30 --json status,conclusion -q '[.[] | select(.status == "completed")][0].conclusion')
          test "$conclusion" = success
      - name: Tag matches both distribution and package versions
        run: |
          python - <<'PY'
          import os, tomllib, amberlog
          project = tomllib.load(open('pyproject.toml', 'rb'))['project']
          assert project['name'] == 'amberlog'
          assert os.environ['GITHUB_REF_NAME'] == 'v' + project['version']
          assert amberlog.__version__ == project['version']
          PY
      - run: python -m unittest discover -s tests -t .
      - run: python -m pip install build twine
      - name: Build once and validate both distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
          python tools/fresh_machine.py dist/amberlog-*.whl
          python -m venv /tmp/amberlog-sdist
          /tmp/amberlog-sdist/bin/pip install dist/amberlog-*.tar.gz
          cd /tmp
          /tmp/amberlog-sdist/bin/amberlog --help
      - uses: actions/upload-artifact@v4
        with:
          name: approved-amberlog-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: qualify
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.index }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: approved-amberlog-distributions
          path: dist/
      - name: Publish to TestPyPI
        if: inputs.index == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: false
      - name: Publish to PyPI
        if: inputs.index == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: false
      - name: Record publication target
        env:
          TARGET: ${{ inputs.index }}
        run: echo "Approved Amberlog artifacts submitted to $TARGET from $GITHUB_SHA. Check the index for acceptance." >> "$GITHUB_STEP_SUMMARY"

name: Release

# Runs only on a version tag. Nothing is published by an ordinary push.
#
#   git tag v0.8.0 && git push origin v0.8.0
#
# What it does, in order, and why each step is a gate rather than a formality:
#
# 1. The tag must equal the version in pyproject.toml *and* in
#    memory_fabric.__version__. They drifted once (0.8.0 vs 0.7.0) and a
#    release is the worst place to find out.
# 2. The full suite runs with nothing installed, and the wheel is installed
#    clean and exercised, as in CI. A release is not cut from a red tree.
# 3. A GitHub release carries the wheel and sdist.
# 4. The container image goes to GHCR, tagged with the version and `latest`.
# 5. PyPI only when the repository variable PYPI_PUBLISH is "true". It is off
#    by default because the distribution name `memory-fabric` is already taken
#    on PyPI by an unrelated project — publishing needs a name decision first
#    (ROADMAP open decision 6). Uses trusted publishing, so no token is stored:
#    configure the publisher on PyPI for this repository and the `pypi`
#    environment, then set the variable.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tag, pyproject and __version__ agree
        run: |
          python - <<'EOF'
          import os, sys, tomllib
          sys.path.insert(0, ".")
          import memory_fabric
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          declared = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          found = {"tag": tag, "pyproject": declared, "__version__": memory_fabric.__version__}
          print(found)
          sys.exit(0 if len(set(found.values())) == 1 else 1)
          EOF

      - name: Tests with nothing installed
        run: python -m unittest discover -s tests -t .

      - name: Fault matrix
        run: python -m experiments.faultsim

      - run: python -m pip install --upgrade build
      - run: python -m build --outdir dist

      - name: The wheel installs clean and works
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/v/bin/memory-fabric --db /tmp/r.db demo
          /tmp/v/bin/memory-fabric --db /tmp/r.db doctor

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release with the built artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for what changed and what was measured."

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          docker build -t "$image:$version" -t "$image:latest" .
          docker push "$image:$version"
          docker push "$image:latest"

  pypi:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

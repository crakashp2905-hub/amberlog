name: Release

# Runs only on a version tag. Nothing is published by an ordinary push.
#
#   git tag v0.8.0 && git push origin v0.8.0
#
# What it does, in order, and why each step is a gate rather than a formality:
#
# 0. CI must have passed on this exact commit, every job of it, including
#    claude-contract, which skips everywhere the anthropic SDK is not installed
#    and so is the job a local run never catches. Branch protection cannot
#    require checks on this plan (docs/BRANCHES.md), so the release enforces it.
# 1. The tag must equal the version in pyproject.toml *and* in
#    memory_fabric.__version__. They drifted once (0.8.0 vs 0.7.0) and a
#    release is the worst place to find out.
# 2. The full suite runs with nothing installed, and the wheel is installed
#    clean and exercised, as in CI. A release is not cut from a red tree.
# 3. A GitHub release carries the wheel and sdist.
# 4. The container image goes to GHCR, tagged with the version and `latest`.
# 5. PyPI only when the repository variable PYPI_PUBLISH is "true". It is off
#    by default because the distribution name `memory-fabric` is already taken
#    on PyPI by an unrelated project — publishing needs a name decision first
#    (ROADMAP open decision 6). Uses trusted publishing, so no token is stored:
#    configure the publisher on PyPI for this repository and the `pypi`
#    environment, then set the variable.
# 6. Supply chain: every wheel, sdist and image gets an SPDX SBOM and a
#    Sigstore-signed build-provenance attestation, so a user can check what an
#    artifact contains and that this workflow, from this commit, built it:
#      gh attestation verify <file> --repo <owner>/<repo>
#      gh attestation verify oci://ghcr.io/<owner>/<repo>:<version> --repo <owner>/<repo>
#    The SBOMs are always produced (attached to the release, and the image's as
#    a workflow artifact). The signed attestations need a public repository or
#    GitHub Enterprise Cloud for a private one, so they run when the repository
#    is public or the variable ATTEST is "true"; this repository is private
#    today, and the steps would otherwise fail the release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: CI passed on this exact commit, every job included
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 20             --json status,conclusion -q '[.[] | select(.status == "completed")][0].conclusion')
          echo "CI on $GITHUB_SHA: ${result:-no completed run}"
          test "$result" = "success"

      - name: Tag, pyproject and __version__ agree
        run: |
          python - <<'EOF'
          import os, sys, tomllib
          sys.path.insert(0, ".")
          import memory_fabric
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          declared = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          found = {"tag": tag, "pyproject": declared, "__version__": memory_fabric.__version__}
          print(found)
          sys.exit(0 if len(set(found.values())) == 1 else 1)
          EOF

      - name: Tests with nothing installed
        run: python -m unittest discover -s tests -t .

      - name: Fault matrix
        run: python -m experiments.faultsim

      - run: python -m pip install --upgrade build
      - run: python -m build --outdir dist

      - name: The wheel installs clean and works
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/v/bin/memory-fabric --db /tmp/r.db demo
          /tmp/v/bin/memory-fabric --db /tmp/r.db doctor

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: SBOM for the Python distributions
        uses: anchore/sbom-action@v0
        with:
          path: dist/
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Provenance for every distribution file
        if: github.event.repository.visibility == 'public' || vars.ATTEST == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: SBOM attestation for every distribution file
        if: github.event.repository.visibility == 'public' || vars.ATTEST == 'true'
        uses: actions/attest-sbom@v2
        with:
          subject-path: "dist/*"
          sbom-path: sbom.spdx.json

      - run: cp sbom.spdx.json dist/memory-fabric.spdx.json

      - name: Create the release with the built artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for what changed and what was measured."

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image name and version
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest

      - name: SBOM for the image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: image.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Provenance for the image
        if: github.event.repository.visibility == 'public' || vars.ATTEST == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: SBOM attestation for the image
        if: github.event.repository.visibility == 'public' || vars.ATTEST == 'true'
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: image.spdx.json
          push-to-registry: true

  pypi:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

# R3: which retriever best_available() ships (research/prereg/r3-best-retriever.md).
# One job per model family in parallel, then one job combines and decides.
name: retriever-eval

on:
  workflow_dispatch:
    inputs:
      lme_limit:
        description: LongMemEval instances (stratified)
        default: "60"
  # Also when the harness itself changes, so a new registration runs before
  # its PR merges (a dispatch-only workflow cannot run until it is on main).
  push:
    paths:
      - experiments/retriever_eval.py
      - experiments/r3_diag.py
      - .github/workflows/retriever-eval.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: retriever-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  part:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        # Amendment 3: only the two families the first run did not measure
        # properly; `decide` reuses run 40235543450's other parts.
        part: [arctic-m, nomic]
        # SciFact in one job; LongMemEval's 60 instances in three shards, so
        # no job embeds ~30,000 turns on its own (amendment 2).
        job: [scifact, lme0, lme1, lme2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[retrieval]"
      - name: Fetch LongMemEval s
        if: matrix.job != 'scifact'
        run: |
          mkdir -p research/bench/longmemeval/data
          curl -fsSL -o research/bench/longmemeval/data/longmemeval_s_cleaned.json \
            https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json
      - name: Run part
        run: |
          if [ "${{ matrix.job }}" = scifact ]; then
            python -m experiments.retriever_eval --part ${{ matrix.part }} --only scifact
          else
            i="${{ matrix.job }}"; i="${i#lme}"
            python -m experiments.retriever_eval --part ${{ matrix.part }} --only longmemeval \
              --shard "$i/3" --lme-limit "${{ inputs.lme_limit || '60' }}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3-part-${{ matrix.part }}-${{ matrix.job }}
          path: research/results/r3-part-*.json
          if-no-files-found: ignore

  decide:
    needs: part
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: r3-part-*
          path: parts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: r3-part-*
          path: prior
          merge-multiple: true
          run-id: 40235543450
          github-token: ${{ github.token }}
      - name: Reuse the first run's parts for families not re-run
        run: |
          for f in prior/*.json; do
            case "$(basename "$f")" in r3-part-arctic-m-*|r3-part-nomic-*) ;; *) cp -n "$f" parts/ ;; esac
          done
      - name: Combine and decide
        run: |
          ls parts
          python -m experiments.retriever_eval --combine parts/*.json --run "${{ github.run_id }}"
          cat research/results/r3-best-retriever.md
      - uses: actions/upload-artifact@v4
        with:
          name: r3-best-retriever
          path: research/results/r3-best-retriever.*

# R3: which retriever best_available() ships (research/prereg/r3-best-retriever.md).
# One job per model family in parallel, then one job combines and decides.
name: retriever-eval

on:
  workflow_dispatch:
    inputs:
      lme_limit:
        description: LongMemEval instances (stratified)
        default: "60"
  # Also when the harness itself changes, so a new registration runs before
  # its PR merges (a dispatch-only workflow cannot run until it is on main).
  push:
    paths:
      - experiments/retriever_eval.py
      - experiments/r3_diag.py
      - .github/workflows/retriever-eval.yml

permissions:
  contents: read

concurrency:
  group: retriever-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: |
          mkdir -p research/bench/longmemeval/data
          curl -fsSL -o research/bench/longmemeval/data/longmemeval_s_cleaned.json \
            https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json
      - run: python -m experiments.r3_diag

  part:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        part: [base, bge-small, bge-base, arctic-m, nomic]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[retrieval]"
      - name: Fetch LongMemEval s
        run: |
          mkdir -p research/bench/longmemeval/data
          curl -fsSL -o research/bench/longmemeval/data/longmemeval_s_cleaned.json \
            https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json
      - name: Run part
        run: python -m experiments.retriever_eval --part ${{ matrix.part }} --lme-limit "${{ inputs.lme_limit || '60' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: r3-part-${{ matrix.part }}
          path: research/results/r3-part-${{ matrix.part }}.json

  decide:
    needs: part
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: r3-part-*
          path: parts
          merge-multiple: true
      - name: Combine and decide
        run: |
          ls parts
          python -m experiments.retriever_eval --combine parts/*.json --run "${{ github.run_id }}"
          cat research/results/r3-best-retriever.md
      - uses: actions/upload-artifact@v4
        with:
          name: r3-best-retriever
          path: research/results/r3-best-retriever.*

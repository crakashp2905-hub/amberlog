name: tau2-eval

# INT-05 pilot: tau2-bench banking_knowledge (MIT) with a local model for both
# agent and simulated user; arms differ only in the knowledge tool
# (benchmarks/tau2_knowledge.py). $0; descriptive.

on:
  push:
    paths: ["benchmarks/tau2_knowledge.py", ".github/workflows/tau2-eval.yml"]
  workflow_dispatch:

jobs:
  arm:
    strategy:
      fail-fast: false
      matrix:
        arm: [no_knowledge, bm25, fabric, golden_retrieval]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tau2 and Memory Fabric
        run: |
          git clone --depth 1 https://github.com/sierra-research/tau2-bench.git tau2
          (cd tau2 && git log -1 --format="%H" && pip install -q -e ".[knowledge]")
          pip install -q -e .
      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (OLLAMA_CONTEXT_LENGTH=8192 ollama serve > ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -s localhost:11434/api/tags && break; sleep 2; done
          ollama pull qwen2.5:3b
      - name: Run arm
        continue-on-error: true
        timeout-minutes: 320
        run: python -m benchmarks.tau2_knowledge --tau2 tau2 --arm ${{ matrix.arm }} --model ollama/qwen2.5:3b --num-tasks 15
      - name: Collect
        if: always()
        run: |
          mkdir -p out
          find . -path ./out -prune -o -name "*int05-${{ matrix.arm }}*" -print | tee found.txt
          while read -r f; do if [ -d "$f" ]; then cp -r "$f" out/; else cp "$f" out/; fi; done < found.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: int05-${{ matrix.arm }}
          path: out
  summarise:
    needs: arm
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e .
      - uses: actions/download-artifact@v4
        with:
          path: results
      - run: find results | head -50 && python -m benchmarks.tau2_knowledge --summarise results

# One replica: a SQLite store has one writer host. For several writer hosts,
# open the store on PostgreSQL (--db postgresql://...) instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "amberlog.name" . }}
  labels: {{- include "amberlog.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {{- include "amberlog.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "amberlog.labels" . | nindent 8 }}
    spec:
      securityContext: {runAsNonRoot: true, fsGroup: 10001}
      initContainers:
        - name: mode
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["sh", "-c", "echo {{ .Values.mode }} > /data/mode"]
          volumeMounts: [{name: data, mountPath: /data}]
      containers:
        - name: dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: dashboard, containerPort: {{ .Values.dashboard.port }}}]
          env:
            - {name: AMBERLOG_TOKEN, valueFrom: {secretKeyRef: {name: {{ include "amberlog.tokenSecret" . }}, key: token}}}
            - {name: AMBERLOG_KEYS, value: /keys}
            {{- with .Values.model }}
            - {name: AMBERLOG_MODEL, value: {{ . | quote }}}
            {{- end }}
            {{- with .Values.embedder }}
            - {name: AMBERLOG_EMBEDDER, value: {{ . | quote }}}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            tcpSocket: {port: dashboard}
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: keys, mountPath: /keys}
        {{- if .Values.agentApi.enabled }}
        - name: agent-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["amberlog", "--db", "/data/store.db", "--keys", "/keys", "agent-api",
                    "--agents-file", "/agents/agents.txt", "--host", "0.0.0.0",
                    "--port", "{{ .Values.agentApi.port }}", "--behind-tls"]
          ports: [{name: agent-api, containerPort: {{ .Values.agentApi.port }}}]
          {{- with .Values.extraEnvFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: keys, mountPath: /keys}
            - {name: agents, mountPath: /agents, readOnly: true}
        {{- end }}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: {{ include "amberlog.name" . }}-data}}
        - {name: keys, persistentVolumeClaim: {claimName: {{ include "amberlog.name" . }}-keys}}
        {{- if .Values.agentApi.enabled }}
        - {name: agents, secret: {secretName: {{ required "set agentApi.agentsSecret" .Values.agentApi.agentsSecret }}, defaultMode: 0400}}
        {{- end }}

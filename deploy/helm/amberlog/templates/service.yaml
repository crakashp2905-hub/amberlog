apiVersion: v1
kind: Service
metadata:
  name: {{ include "amberlog.name" . }}
  labels: {{- include "amberlog.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "amberlog.labels" . | nindent 4 }}
  ports:
    - {name: dashboard, port: {{ .Values.dashboard.port }}, targetPort: dashboard}
    {{- if .Values.agentApi.enabled }}
    - {name: agent-api, port: {{ .Values.agentApi.port }}, targetPort: agent-api}
    {{- end }}

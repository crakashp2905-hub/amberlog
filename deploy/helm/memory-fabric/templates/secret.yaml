{{- if not .Values.dashboard.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mf.tokenSecret" . }}
  labels: {{- include "mf.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ required "set dashboard.token or dashboard.existingSecret" .Values.dashboard.token | quote }}
{{- end }}

image:
  repository: memory-fabric
  tag: "0.14.0"
  pullPolicy: IfNotPresent

# personal | team | regulated (docs/QUICKSTART.md)
mode: team

# Dashboard bearer token. Either name an existing Secret holding key "token",
# or leave existingSecret empty and the chart creates one from `token`.
dashboard:
  existingSecret: ""
  token: ""
  port: 8765

# The agent HTTP API (one process for many agents). Needs a Secret with key
# "agents.txt" in the agent_id:tenant_id:hex_key format.
agentApi:
  enabled: false
  agentsSecret: ""
  port: 8766

# Optional model and retriever choice (docs/guides/any-agent-any-model.md).
# Keys come from Secrets via extraEnvFrom, never from values.
model: ""
embedder: ""
extraEnvFrom: []

persistence:
  data:
    size: 5Gi
    storageClass: ""
  keys:
    size: 64Mi
    storageClass: ""

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 1Gi}

service:
  type: ClusterIP

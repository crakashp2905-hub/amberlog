[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-fabric"
version = "0.14.0"
description = "Memory for AI agents that you can audit, correct and trust: provenance, cross-store retraction, and evidence-gated actions."
readme = "README.md"
requires-python = ">=3.11"
# PEP 639: an SPDX expression and the file, so `License:` is a short
# identifier rather than the whole licence text pasted into the metadata.
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "C R Akash Preetham", email = "crakashp2905@gmail.com" }]
maintainers = [{ name = "C R Akash Preetham", email = "crakashp2905@gmail.com" }]
keywords = ["agent-memory", "llm", "mcp", "provenance", "audit", "governance", "federation",
            "retraction", "ai-safety", "prompt-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
    "Topic :: Security",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

# The core has no runtime dependencies, and that is a design commitment rather
# than an accident: it installs anywhere Python does, and nothing in the
# governance path can break because a transitive dependency moved.
dependencies = []

[project.optional-dependencies]
# Adapters only. `ollama` needs nothing — it speaks HTTP over urllib.
claude = ["anthropic>=0.40"]
# Optional storage backend for writers on more than one machine. The core and
# SQLite, the default, need nothing.
postgres = ["psycopg>=3.1"]
# A LangChain retriever (memory_fabric.integrations.langchain).
langchain = ["langchain-core>=0.3"]
# AES-256-GCM from a maintained library; required by the production crypto
# profile (MEMORY_FABRIC_CRYPTO_PROFILE=production).
crypto = ["cryptography>=42"]
# PDF import (knowledge_compiler.compile_pdf): the text layer, no OCR.
pdf = ["pypdf>=4"]
# Trained retrieval (memory_fabric.retrievers): ONNX models on CPU, no PyTorch.
retrieval = ["fastembed>=0.5"]
# The same with sentence-transformers, for teams already on PyTorch or a GPU.
retrieval-torch = ["sentence-transformers>=3"]

[project.scripts]
memory-fabric = "memory_fabric.cli:main"

[project.urls]
Repository = "https://github.com/crakashp2905-hub/memory-fabric"
Documentation = "https://github.com/crakashp2905-hub/memory-fabric/blob/main/docs/README.md"
Changelog = "https://github.com/crakashp2905-hub/memory-fabric/blob/main/CHANGELOG.md"
Issues = "https://github.com/crakashp2905-hub/memory-fabric/issues"
Security = "https://github.com/crakashp2905-hub/memory-fabric/blob/main/SECURITY.md"

[tool.setuptools.packages.find]
include = ["memory_fabric*"]

[tool.setuptools.package-data]
# The dashboard is served from disk at runtime, so it has to ship inside the
# wheel; without this the web UI 500s on a pip-installed copy. `doctor` checks
# for it, because that failure only shows up when an operator opens the page.
"memory_fabric.observability" = ["static/*.html", "static/*.json"]
# PEP 561. The public APIs carry type hints (AGENTS.md requires it), and
# without this marker no type checker in a consuming project reads them: the
# hints exist and are invisible, which is the worst of both.
"memory_fabric" = ["py.typed"]

# Lint and type checking, enforced by the `lint` CI job. Scoped to the shipped
# packages: experiments and tests are research code and are compiled, not
# linted. ruff's default rule set (pyflakes plus the E4/E7/E9 pycodestyle
# errors) -- the checks that find bugs, not style -- with the line length the
# code is written to.
[tool.ruff]
line-length = 100
include = ["memory_fabric/**/*.py", "memeval/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["memory_fabric", "memeval", "benchmarks"]
# psycopg, anthropic and cryptography are optional; their absence must not
# fail a check of the zero-dependency core.
ignore_missing_imports = true
# Not `warn_unused_ignores`: the ignores on optional imports (psycopg,
# langfuse) are needed when those packages are installed and unused when they
# are not, so the warning would make the verdict depend on the environment.
